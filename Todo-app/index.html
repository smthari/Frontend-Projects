<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch JS Todo List</title>
    <link rel="stylesheet" href="style.css" />
    <script async defer src="https://buttons.github.io/buttons.js"></script>
    <style>
        .icon {
            font-size: 7rem;
        }

        .completed {
            text-decoration: line-through;
            color: grey;
        }

        .delete-btn {
            margin-left: 10px;
            cursor: pointer;
            background: #ff4d4d;
            border: none;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            border: 0;
        }
    </style>
</head>

<body>
    <nav>
        <!-- Optional navigation content -->
    </nav>

    <div class="container">
        <ul class="todo-list js-todo-list"></ul>

        <div class="empty-state">
            <h1 class="app-title">My Todo</h1>
            <i class="fas fa-tasks icon"></i>
            <p class="empty-state__description">
                Type in the field below 👇 and press Enter to add your todo
            </p>
        </div>

        <form class="formselect">
            <label for="todo-input" class="sr-only">Add Todo</label>
            <input id="todo-input" autofocus type="text" class="inputselect" placeholder="Eg: Workout">
        </form>
    </div>

    <script src="https://kit.fontawesome.com/dd8c49730d.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
